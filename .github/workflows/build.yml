name: build-ko

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # 小米官方仓库；红米K40游戏增强版 ares 的分支名是 ares-r-oss
      KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
      KERNEL_BRANCH: ares-r-oss
      # 备用镜像（官方仓库挂了/太慢时取消注释换用）
      # KERNEL_REPO: https://github.com/AbzRaider/kernel_xiaomi_ares
      # KERNEL_BRANCH: S
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu make git

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_ares \
            || git clone --depth 1 "https://github.com/AbzRaider/kernel_xiaomi_ares" -b S kernel_ares

      - name: Upload phone config (optional)
        uses: actions/upload-artifact@v4
        with:
          name: phone-config
          path: config   # 把手机上 `zcat /proc/config.gz` 得到的 config 文件放仓库根目录即可启用
        continue-on-error: true

      - name: Prepare kernel
        run: |
          cd kernel_ares
          if [ -f ../config ]; then
            cp ../config .config
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          else
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ares_defconfig
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

      - name: Build driver
        run: |
          bash tools/randomize.sh
          bash tools/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pubgm_self_drv
          path: |
            pubgm_self_drv.ko
            user/test_client
            user/libclient.a
