name: build-ko

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.c'
      - '**/*.h'
      - 'Makefile'
      - 'Kbuild'
      - 'Makefile.inc'
      - 'tools/*.sh'
      - '.github/workflows/*.yml'

env:
  KERNEL_PREP_URL: "https://github.com/REPLACE_WITH_YOUR_USER/REPLACE_WITH_YOUR_REPO/releases/download/kernel-prep/kernel_ares_prepared.tar.zst"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: 检查工具链（ubuntu-latest 预装，绝不调用 apt）
        run: |
          echo "[*] 检查工具链 ..."
          for t in aarch64-linux-gnu-gcc bc bison flex; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "[+] $t: $($t --version | head -1)"
            else
              echo "[-] $t 缺失，ubuntu-latest 本应预装，请检查镜像"
              exit 1
            fi
          done
          echo "[+] 全部就绪"

      - name: 准备内核树
        run: |
          set -u
          KS="$GITHUB_WORKSPACE/kernel_ares"
          mkdir -p "$KS"
          echo "[*] 尝试下载预编译内核树 ..."
          if curl -sSL -o kernel.tar.zst "$KERNEL_PREP_URL" 2>/dev/null && [ -s kernel.tar.zst ]; then
            echo "[+] 下载成功"
            tar -xf kernel.tar.zst -C "$GITHUB_WORKSPACE" 2>&1 | tail -3
          else
            echo "[!] 预编译内核树不可用，将现场 clone 并编译"
          fi
          ls -la "$KS" 2>/dev/null | head -20
          if [ ! -f "$KS/Module.symvers" ]; then
            echo "[*] Module.symvers 缺失，现场 clone 内核并全量编译 ..."
            CFG=""
            for f in .config config kernel_config config.txt; do
              [ -f "$f" ] && CFG="$f" && break
            done
            [ -z "$CFG" ] && { echo "[-] 根目录无 .config 且无可下载内核树"; exit 1; }
            echo "[+] 使用 $CFG"
            git clone --depth 1 -b ares-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource "$KS" || \
            git clone --depth 1 -b ares-r-oss https://github.com/AbzRaider/kernel_xiaomi_ares "$KS" || \
              { echo "[-] clone 失败"; exit 1; }
            cp "$CFG" "$KS/.config"
            cd "$KS"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image modules 2>&1 | tail -20
            cd "$GITHUB_WORKSPACE"
          fi
          [ -f "$KS/Module.symvers" ] || { echo "[-] Module.symvers 仍缺失"; exit 2; }
          echo "[+] Module.symvers 就绪 ($(wc -l < "$KS/Module.symvers") 条)"

      - name: 编译驱动
        run: |
          set -u
          echo "[*] randomize ..."
          sh ./tools/randomize.sh || { echo "[-] randomize 失败"; exit 1; }
          sh ./tools/sync_client.sh || echo "[!] sync 失败，继续"
          echo "[*] make ..."
          KERNEL_TREE="$GITHUB_WORKSPACE/kernel_ares" sh ./tools/build.sh 2>&1 | tee build.log
          [ -f pubgm_self_drv.ko ] || { echo "[-] 未产出 .ko"; tail -50 build.log; exit 2; }

      - name: 编译用户态 client
        run: |
          set -u
          aarch64-linux-gnu-gcc -static -Wall -O2 -o user/test_client user/test_client.c user/client.c \
            && echo "[+] test_client 交叉编译成功" \
            || echo "[!] test_client 失败"
          ls -lh user/test_client 2>/dev/null

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pubgm_self_drv
          path: |
            pubgm_self_drv.ko
            user/test_client
            tools/load.sh
            tools/randomize.sh
            tools/sync_client.sh
          retention-days: 7
