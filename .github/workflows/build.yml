# AUTOBUILD: 20261110-2330
# 方案B+: 官方 Ubuntu 源装 aarch64 工具链
#   针对 #18 exit code 2 (drivers/modules.builtin Makefile:1420) 做防错:
#     - 接受内核未开启可加载模块 (CONFIG_MODULES=n) 的场景
#     - 若 make modules 失败, 改用 make M= 单模块编译
#     - 抑制 objtool/hostcc 噪声
name: build-ko

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.c'
      - '**/*.h'
      - 'Makefile'
      - 'Kbuild'
      - 'Makefile.inc'
      - 'tools/*.sh'
      - '.github/workflows/*.yml'

env:
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: 安装交叉编译器与内核构建依赖
        run: |
          echo "[*] 检查镜像自带 aarch64 工具链 ..."
          if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            echo "[+] 镜像已自带: $(aarch64-linux-gnu-gcc --version | head -1)"
          else
            echo "[*] 镜像未预装, 通过官方 Ubuntu 源安装 gcc-aarch64-linux-gnu ..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              bc bison flex libelf-dev libssl-dev libncurses-dev \
              cpio kmod tar gzip xz-utils
            command -v aarch64-linux-gnu-gcc >/dev/null 2>&1 || { echo "[-] 安装后仍缺失"; exit 1; }
            echo "[+] 安装完成: $(aarch64-linux-gnu-gcc --version | head -1)"
          fi
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      - name: 准备内核树
        run: |
          set -u
          KS="$GITHUB_WORKSPACE/kernel_ares"
          mkdir -p "$KS"
          echo "[*] 检查预编译内核树 ..."
          if [ -n "${KERNEL_PREP_URL:-}" ] && curl -sSL -o kt.zst "$KERNEL_PREP_URL" 2>/dev/null && [ -s kt.zst ]; then
            echo "[+] 下载成功, 解压 ..."
            tar -xf kt.zst -C "$GITHUB_WORKSPACE"
          fi
          if [ -f "$KS/Module.symvers" ]; then
            echo "[+] 已有 Module.symvers ($(wc -l < "$KS/Module.symvers") 条)"
          else
            echo "[*] 现场 clone + 全量编译内核 ..."
            CFG=""
            for f in .config config kernel_config config.txt; do
              if [ -f "$f" ]; then CFG="$f"; break; fi
            done
            if [ -z "$CFG" ]; then
              echo "[-] 根目录无 .config, 无法继续"; exit 1
            fi
            echo "[+] 使用 $CFG"
            git clone --depth 1 -b ares-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource "$KS" || \
            git clone --depth 1 -b ares-r-oss https://github.com/AbzRaider/kernel_xiaomi_ares "$KS" || \
              { echo "[-] clone 内核失败"; exit 1; }
            cp "$CFG" "$KS/.config"
            cd "$KS"
            # 确保可加载模块已开启, 关闭会触发 modules.builtin 目标缺失
            ./scripts/config --file .config -e MODULES -e MODULES_USE_STRCMP -e MODULE_UNLOAD
            ./scripts/config --file .config -e NET -e INET -e UNIX
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
            echo "[*] 先确认内核配置中 CONFIG_MODULES ..."
            grep -E "^CONFIG_MODULES=" .config || echo "[-] CONFIG_MODULES 未设置, 强制 =y"
            echo "[*] 编译内核 Image + modules (失败不中断) ..."
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image modules 2>&1 | tail -20 || true
            cd "$GITHUB_WORKSPACE"
          fi
          if [ -f "$KS/Module.symvers" ]; then
            echo "[+] 内核树就绪: $(wc -l < "$KS/Module.symvers") 条符号"
          else
            echo "[-] Module.symvers 未生成, 尝试降级编译 ..."
            cd "$KS"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" prepare scripts 2>&1 | tail -10 || true
            cd "$GITHUB_WORKSPACE"
            [ -f "$KS/Module.symvers" ] || echo "[!] 无 Module.symvers, 后续以单模块模式编译"
          fi

      - name: 编译驱动
        run: |
          set -u
          echo "[*] randomize ..."
          sh ./tools/randomize.sh || { echo "[-] randomize 失败"; exit 1; }
          sh ./tools/sync_client.sh || echo "[!] sync 失败, 继续"
          echo "[*] make ..."
          KERNEL_TREE="$GITHUB_WORKSPACE/kernel_ares" sh ./tools/build.sh 2>&1 | tee build.log
          [ -f pubgm_self_drv.ko ] || { echo "[-] 未产出 .ko"; tail -80 build.log; exit 2; }
          echo "[+] 产物: $(ls -lh pubgm_self_drv.ko | awk '{print $5, $9}')"

      - name: 编译用户态 client
        run: |
          set -u
          aarch64-linux-gnu-gcc -static -Wall -O2 -o user/test_client user/test_client.c user/client.c \
            && echo "[+] test_client 交叉编译成功" \
            || echo "[!] test_client 失败"
          ls -lh user/test_client 2>/dev/null

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pubgm_self_drv
          path: |
            pubgm_self_drv.ko
            user/test_client
            tools/load.sh
            tools/randomize.sh
            tools/sync_client.sh
          retention-days: 7
