# AUTOBUILD: 20261110-2240
# 工具链策略: 镜像自带 / 本地 bootstrap 兜底, 全程不联网下载外部二进制
name: build-ko

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.c'
      - '**/*.h'
      - 'Makefile'
      - 'Kbuild'
      - 'Makefile.inc'
      - 'tools/*.sh'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: 准备交叉编译器（镜像自带 / bootstrap / 自建 release）
        id: tc
        run: |
          set -u
          PREFIX="$GITHUB_WORKSPACE/toolchain"
          mkdir -p "$PREFIX"
          log() { echo "$@"; }

          log "[1/3] 检查镜像自带 aarch64 工具链 ..."
          HOST_GCC="$(command -v aarch64-linux-gnu-gcc || true)"
          if [ -n "$HOST_GCC" ]; then
            log "[+] 镜像自带: $HOST_GCC"
            printf 'CROSS_COMPILE=aarch64-linux-gnu-\n' >> "$GITHUB_ENV"
            echo "tc_source=host-image" >> "$GITHUB_OUTPUT"
            log "[+] 工具链就绪 (镜像自带)"
            exit 0
          fi
          log "[-] 镜像无自带 aarch64 工具链"

          log "[2/3] 尝试本地 bootstrap musl 交叉编译器 ..."
          for t in gcc g++ make git curl; do
            command -v "$t" >/dev/null 2>&1 && log "[+] $t: $($t --version | head -1)" || log "[-] 缺少宿主工具: $t"
          done

          mkdir -p "$GITHUB_WORKSPACE/bootstrap"
          cd "$GITHUB_WORKSPACE/bootstrap"

          if git clone --depth 1 https://github.com/richfelker/musl-cross-make.git 2>&1 | tail -3; then
            cd musl-cross-make
            printf '%s\n' \
              'TARGET = aarch64-linux-musl' \
              'OUTPUT = /opt/cross' \
              'GCC_VER = 11.5.0' \
              'MUSL_VER = 1.2.5' \
              'BINUTILS_VER = 2.42' \
              'COMMON_CONFIG += CFLAGS="-O2 -pipe" CXXFLAGS="-O2 -pipe"' \
              'GCC_CONFIG += --enable-languages=c,c++ --disable-multilib' \
              'DL_CMD = curl -C - -L -o' \
              > config.mak
            log "[*] 开始编译 (可能 15-40 分钟, 全本地) ..."
            if make -j"$(nproc)" 2>&1 | tail -5; then
              if [ -x /opt/cross/bin/aarch64-linux-musl-gcc ]; then
                ln -sfn /opt/cross "$PREFIX/musl-cross"
                printf '%s/musl-cross/bin\n' "$PREFIX" >> "$GITHUB_PATH"
                printf 'CROSS_COMPILE=aarch64-linux-musl-\n' >> "$GITHUB_ENV"
                echo "tc_source=bootstrap" >> "$GITHUB_OUTPUT"
                log "[+] 本地 bootstrap 成功"
                exit 0
              fi
            fi
            log "[-] 本地 bootstrap 编译失败"
          else
            log "[-] clone musl-cross-make 失败 (网络受限?)"
          fi

          log "[3/3] 前两种均失败. 请本地准备工具链并上传 Release 'toolchain':"
          log "    $ wget https://musl.cc/aarch64-linux-musl-cross.tgz"
          log "    $ tar xf aarch64-linux-musl-cross.tgz"
          log "    $ tar cJf aarch64-musl-toolchain.tar.xz aarch64-linux-musl-cross"
          log "    到 GitHub Releases -> New, Tag 填 'toolchain', 上传 .tar.xz"
          exit 1

      - name: 准备内核树
        run: |
          set -u
          KS="$GITHUB_WORKSPACE/kernel_ares"
          mkdir -p "$KS"
          log() { echo "$@"; }

          CFG=""
          for f in .config config kernel_config config.txt; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then CFG="$GITHUB_WORKSPACE/$f"; break; fi
          done
          if [ -n "$CFG" ]; then log "[+] 使用配置: $CFG"; else log "[!] 根目录无 .config"; fi

          if [ ! -f "$KS/Module.symvers" ]; then
            log "[*] 内核树未就绪, 现场 clone 并编译 ..."
            rm -rf "$KS"
            if ! git clone --depth 1 -b ares-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource "$KS" 2>&1 | tail -3; then
              log "[-] MiCode 源不可用, 尝试备用源 ..."
              git clone --depth 1 -b ares-r-oss https://github.com/AbzRaider/kernel_xiaomi_ares "$KS" 2>&1 | tail -3 \
                || { log "[-] 内核源码 clone 失败"; exit 2; }
            fi
            if [ -n "$CFG" ]; then cp "$CFG" "$KS/.config"; else : > "$KS/.config"; fi
            cd "$KS"
            log "[*] 生成默认配置 ..."
            make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" defconfig 2>&1 | tail -3 || true
            [ -f .config ] || { log "[-] 无法生成内核 .config"; exit 2; }
            log "[*] 编译内核 (Image + modules) ..."
            make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" -j"$(nproc)" Image modules 2>&1 | tail -8
            cd "$GITHUB_WORKSPACE"
          fi

          if [ -f "$KS/Module.symvers" ]; then
            log "[+] Module.symvers 就绪 ($(wc -l < "$KS/Module.symvers") 条)"
          else
            log "[-] Module.symvers 仍缺失, 检查内核编译日志"; exit 2
          fi

      - name: 编译驱动
        run: |
          set -u
          echo "[*] CROSS_COMPILE=$CROSS_COMPILE"
          [ -x tools/randomize.sh ] && sh ./tools/randomize.sh || echo "[!] randomize 跳过"
          [ -x tools/sync_client.sh ] && sh ./tools/sync_client.sh || echo "[!] sync 跳过"
          KERNEL_TREE="$GITHUB_WORKSPACE/kernel_ares" sh ./tools/build.sh 2>&1 | tee build.log
          if [ -f pubgm_self_drv.ko ]; then
            echo "[+] 产物: $(ls -lh pubgm_self_drv.ko | awk '{print $5, $9}')"
          else
            echo "[-] 未产出 .ko, 后 60 行日志:"; tail -60 build.log; exit 2
          fi

      - name: 编译用户态 client
        run: |
          set -u
          if [ -d user ] && [ -f user/test_client.c ]; then
            $CROSS_COMPILE-gcc -static -Wall -O2 -o user/test_client user/test_client.c user/client.c \
              && echo "[+] test_client OK" || echo "[!] test_client 失败(可忽略)"
          else
            echo "[!] user/ 源码缺失, 跳过"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pubgm_self_drv
          path: |
            pubgm_self_drv.ko
            user/test_client
            tools/load.sh
            tools/randomize.sh
            tools/sync_client.sh
          retention-days: 7
