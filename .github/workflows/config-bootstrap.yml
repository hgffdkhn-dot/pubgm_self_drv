name: config-bootstrap

on:
  workflow_dispatch:
  push:
    paths: [config.txt, kernel_config.txt, .config]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 解析配置并生成内核 defconfig
        run: |
          echo "[*] 转换 .config -> ares_defconfig ..."
          sh ./tools/prep_kernel.sh 2>&1 | tee prep.log
          echo "[*] 产物:"
          ls -lh *.config ares_defconfig 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: |
            ares_defconfig
            prep.log
          retention-days: 7
